<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Complaint — RMS AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding:0; min-height:100vh; display:flex; flex-direction:column; }
    .page-wrap { flex:1; max-width:620px; width:100%; margin:40px auto; padding:0 20px; }
    h1 { font-size:24px; font-weight:700; margin-bottom:4px; }
    .sub { color:var(--text-muted); font-size:14px; margin-bottom:28px; }
    .search-row { display:flex; gap:10px; margin-bottom:28px; }
    .search-row .form-input { flex:1; }

    /* Timeline */
    .timeline { display:none; flex-direction:column; gap:0; }
    .timeline.show { display:flex; }
    .tl-step { display:flex; gap:14px; position:relative; padding-bottom:24px; }
    .tl-step:last-child { padding-bottom:0; }
    .tl-step::before {
      content:''; position:absolute; left:14px; top:30px;
      width:2px; height:calc(100% - 10px);
      background:var(--border);
    }
    .tl-step:last-child::before { display:none; }
    .tl-dot {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:14px; border:2px solid var(--border);
      background:var(--surface); z-index:1;
    }
    .tl-dot.done  { background:var(--green);  border-color:var(--green);  }
    .tl-dot.active{ background:var(--blue);   border-color:var(--blue);   box-shadow:0 0 0 4px rgba(88,166,255,0.2); }
    .tl-content { flex:1; padding-top:3px; }
    .tl-label { font-size:15px; font-weight:600; }
    .tl-desc  { font-size:13px; color:var(--text-muted); margin-top:2px; }

    .detail-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:20px; }
    .detail-row  { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px; }
    .detail-row:last-child { border-bottom:none; }
    .detail-row .lbl { color:var(--text-muted); }
  </style>
</head>
<body>
  <div class="bg-animated"></div>
  <div id="toast-container"></div>

  <nav class="navbar">
    <a class="navbar-brand" href="homepage.html"><span class="brand-dot"></span>RMS AI</a>
    <span class="navbar-info">Logged in as <span id="navName">Student</span></span>
  </nav>

  <div class="page-wrap fade-in">
    <h1>Track Your Complaint</h1>
    <p class="sub">Enter your Request ID to see the current status and details.</p>

    <div class="search-row">
      <input class="form-input" id="reqID" placeholder="Paste your Request ID here…">
      <button class="btn btn-primary" id="checkBtn" onclick="checkStatus()">Check</button>
    </div>

    <div class="detail-card" id="detailBox" style="display:none;"></div>

    <div class="timeline" id="timeline">
      <div class="tl-step" id="step-submitted">
        <div class="tl-dot">📨</div>
        <div class="tl-content">
          <div class="tl-label">Submitted</div>
          <div class="tl-desc">Request received by the system</div>
        </div>
      </div>
      <div class="tl-step" id="step-assigned">
        <div class="tl-dot">👷</div>
        <div class="tl-content">
          <div class="tl-label">Assigned</div>
          <div class="tl-desc" id="assignedDesc">Waiting for assignment</div>
        </div>
      </div>
      <div class="tl-step" id="step-progress">
        <div class="tl-dot">⚙️</div>
        <div class="tl-content">
          <div class="tl-label">In Progress</div>
          <div class="tl-desc">Technician is working on it</div>
        </div>
      </div>
      <div class="tl-step" id="step-resolved">
        <div class="tl-dot">✅</div>
        <div class="tl-content">
          <div class="tl-label">Resolved</div>
          <div class="tl-desc">Issue has been fixed</div>
        </div>
      </div>
    </div>

    <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
      <a href="complaint.html" class="btn btn-outline" style="font-size:14px;">+ New Request</a>
      <a href="history.html"   class="btn btn-outline" style="font-size:14px;">📋 My History</a>
    </div>
  </div>

  <script>
    function toast(msg,type="info"){const c=document.getElementById("toast-container");const t=document.createElement("div");t.className=`toast ${type}`;t.textContent=msg;c.appendChild(t);setTimeout(()=>{t.style.animation="slide-out 0.3s ease forwards";setTimeout(()=>t.remove(),300);},3500);}

    document.getElementById("navName").textContent = localStorage.getItem("student_name") || "Student";

    // Pre-fill if coming from complaint page
    const urlId = new URLSearchParams(window.location.search).get("id");
    if (urlId) { document.getElementById("reqID").value = urlId; checkStatus(); }

    document.getElementById("reqID").addEventListener("keydown", e => { if(e.key==="Enter") checkStatus(); });

    async function checkStatus() {
      const id  = document.getElementById("reqID").value.trim();
      const btn = document.getElementById("checkBtn");
      if (!id) { toast("Please enter a Request ID","error"); return; }
      btn.disabled=true; btn.textContent="Checking…";

      try {
        const res  = await fetch(`/get_status?id=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.error) { toast(data.error,"error"); }
        else { showDetails(data); }
      } catch { toast("Server error. Try again.","error"); }
      finally { btn.disabled=false; btn.textContent="Check"; }
    }

    function showDetails(d) {
      const box = document.getElementById("detailBox");
      box.style.display = "block";
      
      const isAiResolved = d.status === "ai_resolved" || d.status === "ai_answered" || !!d.ai_response;
      const techDisplay  = d.technician || (isAiResolved ? "AI Answered" : "Not assigned");
      
      box.innerHTML = `
        <div class="detail-row"><span class="lbl">Issue</span><span>${d.query}</span></div>
        <div class="detail-row"><span class="lbl">Category</span><span>${d.category||"—"}</span></div>
        <div class="detail-row"><span class="lbl">Technician</span><span>${techDisplay}</span></div>
        <div class="detail-row"><span class="lbl">Scheduled</span><span>${d.assigned_time ? "Hour "+d.assigned_time+":00" : "—"}</span></div>
        <div class="detail-row"><span class="lbl">Status</span><span class="badge badge-${isAiResolved ? 'resolved' : d.status}">${isAiResolved ? 'AI Answered' : d.status}</span></div>
        ${d.ai_response ? `
        <div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--border);">
          <div style="font-size:12px; font-weight:700; color:var(--blue); margin-bottom:6px; display:flex; align-items:center; gap:6px;">✨ Instant AI Guidance / Answer</div>
          <div style="font-size:13.5px; line-height:1.6; color:var(--text); background:var(--surface); padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); white-space:pre-wrap;">${d.ai_response}</div>
        </div>` : ''}
      `;

      // Timeline
      const tl = document.getElementById("timeline");
      tl.classList.add("show");

      const steps = ["submitted","assigned","in_progress","resolved"];
      const statusMap = { pending:0, no_technician:0, assigned:1, in_progress:2, resolved:3, ai_resolved:3, ai_answered:3 };
      const current = statusMap[d.status] ?? (isAiResolved ? 3 : 0);

      document.querySelector("#step-submitted .tl-dot").classList.toggle("done", current >= 0);
      document.querySelector("#step-assigned  .tl-dot").classList.toggle("done", current >= 1 || isAiResolved);
      document.querySelector("#step-progress  .tl-dot").classList.toggle("done", current >= 2 || isAiResolved);
      document.querySelector("#step-resolved  .tl-dot").classList.toggle("done", current >= 3 || isAiResolved);

      if (d.technician) {
        document.getElementById("assignedDesc").textContent = `Assigned to ${d.technician}`;
      } else if (isAiResolved) {
        document.getElementById("assignedDesc").textContent = `Handled instantly by Academic AI`;
      }
    }
  </script>
</body>
</html>
