<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login — RMS AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .login-wrap { width:100%; max-width:400px; }
    .login-header { text-align:center; margin-bottom:32px; }
    .login-logo { font-size:40px; margin-bottom:12px; }
    .login-header h2 { font-size:26px; font-weight:800; margin-bottom:6px; }
    .login-header p  { font-size:14px; color:var(--text-muted); }
    .login-card { padding:32px; }
    .eye-btn {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:16px; padding:4px;
    }
    .input-wrap { position:relative; }
    .input-wrap .form-input { padding-right:42px; }
    .back-link { text-align:center; margin-top:16px; }
    .back-link a { color:var(--text-muted); font-size:14px; text-decoration:none; }
    .back-link a:hover { color:var(--blue); }
    .demo-box {
      margin-top:20px; padding:14px 16px;
      background:rgba(88,166,255,0.07); border:1px solid rgba(88,166,255,0.2);
      border-radius:var(--radius-sm); font-size:13px; color:var(--text-muted);
    }
    .demo-box strong { color:var(--blue); }
  </style>
</head>
<body>
  <div class="bg-animated"></div>
  <div id="toast-container"></div>

  <div class="login-wrap fade-in">
    <div class="login-header">
      <div class="login-logo">🎓</div>
      <h2>Student Login</h2>
      <p>Sign in to submit and track your complaints</p>
    </div>

    <div class="glass-card login-card">
      <div class="form-group">
        <label class="form-label" for="student_id">Student ID</label>
        <input class="form-input" type="text" id="student_id" placeholder="e.g. 12345" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <input class="form-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
          <button class="eye-btn" id="eyeBtn" type="button" title="Show/hide password">👁</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" id="loginBtn">Sign In</button>

      <div class="demo-box">
        <strong>Demo account:</strong> ID: <code>12345</code> &nbsp; Password: <code>pass123</code>
      </div>
    </div>

    <div class="back-link">
      <a href="homepage.html">← Back to Home</a>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
