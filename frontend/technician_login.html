<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technician Login — RMS AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
    .login-wrap  { width:100%; max-width:400px; }
    .login-header { text-align:center; margin-bottom:32px; }
    .login-logo  { font-size:40px; margin-bottom:12px; }
    .login-header h2 { font-size:26px; font-weight:800; margin-bottom:6px; }
    .login-header p  { font-size:14px; color:var(--text-muted); }
    .login-card  { padding:32px; }
    .back-link   { text-align:center; margin-top:16px; }
    .back-link a { color:var(--text-muted); font-size:14px; text-decoration:none; }
    .back-link a:hover { color:var(--green); }
    .demo-box {
      margin-top:20px; padding:14px 16px;
      background:rgba(63,185,80,0.07); border:1px solid rgba(63,185,80,0.2);
      border-radius:var(--radius-sm); font-size:13px; color:var(--text-muted);
    }
    .demo-box strong { color:var(--green); }
  </style>
</head>
<body>
  <div class="bg-animated"></div>
  <div id="toast-container"></div>

  <div class="login-wrap fade-in">
    <div class="login-header">
      <div class="login-logo">🔧</div>
      <h2>Technician Login</h2>
      <p>Sign in to view and manage your assigned tasks</p>
    </div>

    <div class="glass-card login-card">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-input" type="text" id="name" placeholder="e.g. Ravi" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button class="btn btn-success btn-block" id="loginBtn">Sign In</button>

      <div class="demo-box">
        <strong>Demo accounts:</strong><br>
        Ravi / Suresh / Aman / Neha &nbsp;·&nbsp; Password: <code>tech123</code>
      </div>
    </div>

    <div class="back-link">
      <a href="homepage.html">← Back to Home</a>
    </div>
  </div>

  <script src="technician_login.js"></script>
</body>
</html>
