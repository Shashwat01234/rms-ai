services:
  - type: web
    name: rms-ai
    env: python
    buildCommand: "pip install -r requirements.txt && python database.py"
    startCommand: "gunicorn server:app --bind 0.0.0.0:$PORT --workers 2"
    plan: free
    envVars:
      - key: ADMIN_PASSWORD
        value: admin123
      - key: SECRET_KEY
        generateValue: true
